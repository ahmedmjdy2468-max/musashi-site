export function SiteStats() {
  const [s, setS] = useState<J | null>(null);
  useEffect(() => { get("/api/stats").then(setS).catch(() => setS(null)); }, []);
  const v = (n?: number) => (s ? String(n) : "—");
  return (
    <div className="mu-grid-3 mu-dashboard-stats" style={{ marginTop: 15 }}>
      <div className="mu-panel mu-stat"><span className="mu-stat-icon">◈</span><span className="mu-stat-label">أماكن متاحة</span><strong className="mu-stat-value live">{v(s?.available)}</strong><span className="mu-stat-foot">من أصل {s ? s.total : "—"}</span></div>
      <div className="mu-panel mu-stat"><span className="mu-stat-icon">◉</span><span className="mu-stat-label">بوتات مفعّلة</span><strong className="mu-stat-value live">{v(s?.active)}</strong><span className="mu-stat-foot">متصلة الآن</span></div>
      <div className="mu-panel mu-stat"><span className="mu-stat-icon">⚠</span><span className="mu-stat-label">بوتات منفصلة</span><strong className="mu-stat-value live">{v(s?.disconnected)}</strong><span className="mu-stat-foot">تحتاج إعادة تنصيب</span></div>
    </div>
  );
}

type Phase = "idle" | "starting" | "waiting" | "pair" | "ready" | "active" | "closed";

export function ConnectPanel({ goTo, toast, onPhase }: Common & { onPhase: (p: Phase) => void }) {
  const [phone, setPhone] = useState("");
  const [phase, setPhaseRaw] = useState<Phase>("idle");
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const stop = useRef<null | (() => void)>(null);
  const setPhase = (p: Phase) => { setPhaseRaw(p); onPhase(p); };
  useEffect(() => () => stop.current?.(), []);

  const start = async (e: FormEvent) => {
    e.preventDefault();
    setError(""); setCode(""); stop.current?.();
    setPhase("starting");
    try {
      const r = await post("/api/install", { phone });
      setPhase("waiting");
      stop.current = listen(`/api/install/events?t=${encodeURIComponent(r.watch)}`, {
        pair: (d) => { setCode(d.code); setPhase("pair"); },
        ready: () => { setPhase("ready"); stop.current?.(); },
        close: () => { setPhase("closed"); },
      });
    } catch (err) {
      if (err instanceof ApiError && err.code === "ACTIVE") { setPhase("active"); return; }
      setPhase("idle"); setError(errMsg(err));
    }
  };

  const busy = phase === "starting" || phase === "waiting" || phase === "pair";
  return (
    <section id="mu-connect-card" className="mu-panel mu-panel-inner">
      <div className="mu-panel-title"><h2><span className="mu-section-icon">◈</span> ربط رقم واتساب</h2><small>تنصيب واحد لكل رقم</small></div>
      <form onSubmit={start}>
        <label className="mu-field-label" htmlFor="mu-phone">رقم الهاتف المرتبط بحساب واتساب (بصيغة دولية)</label>
        <div className="mu-phone-wrap">
          <input className="mu-phone-input" id="mu-phone" inputMode="tel" autoComplete="tel" dir="ltr" placeholder="9689xxxxxxx"
            value={phone} onChange={(e) => setPhone(e.currentTarget.value)} disabled={busy} required />
          <button className="mu-btn-primary" type="submit" disabled={busy || !phone.trim()}>{phase === "starting" ? "جارٍ التجهيز…" : "تجهيز الإقران"}</button>
        </div>
      </form>
      <Err text={error} />

      {phase === "active" && <div className="mu-state-banner ready"><strong>البوت مفعّل ✅</strong><span>هذا الرقم منصَّب ومتصل. لا حاجة لتنصيب جديد.</span><button className="mu-btn-secondary" type="button" onClick={() => goTo("dashboard")}>ادخل لوحة التحكم</button></div>}
      {phase === "closed" && <div className="mu-state-banner warn"><strong>انقطع الاتصال أثناء الإقران ⚠️</strong><span>اضغط «تجهيز الإقران» للمحاولة من جديد.</span></div>}
      {phase === "ready" && <div className="mu-state-banner ready"><strong>✅ تم ربط بوتك بنجاح</strong><span>يمكنك الآن الدخول إلى لوحة التحكم.</span><button className="mu-btn-primary" type="button" onClick={() => goTo("dashboard")}>ادخل لوحة التحكم</button></div>}

      <div className={`mu-code-slot ${phase === "pair" ? "live" : ""}`}>
        <div>
          <strong>رمز الإقران</strong>
          <small>{phase === "pair" ? "أدخله في واتساب الآن." : phase === "waiting" ? "بانتظار رمز الإقران من البوت…" : "يظهر هنا بعد تجهيز الإقران."}</small>
        </div>
        <span className="mu-code-value" dir="ltr" aria-live="polite">{phase === "pair" ? code : "········"}</span>
        {phase === "pair" && <button className="mu-btn-quiet" type="button" onClick={() => { void navigator.clipboard?.writeText(code); toast("تم نسخ الرمز."); }}>نسخ</button>}
      </div>
    </section>
  );
}

export const installSteps = (
