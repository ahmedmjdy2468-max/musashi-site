import express from "express";
import fs from "node:fs";
import path from "node:path";
import crypto from "node:crypto";
import {
  sha256, hmac, randomToken, safeEqual, signValue, unsignValue, parseCookies, setCookie, clearCookie,
  createLimiter, createLockout, verifyPassword,
} from "./security.js";
import { createHub } from "./hub.js";
import { normPhone, maskPhone, cleanText, hasLink, hasBadWord, normalizeArabic, validAvatar } from "./util.js";
import { BAD_WORDS } from "./badwords.js";

const DAY = 86_400_000;
const OWNER_TTL = 30 * DAY;
const DEV_TTL = 12 * 3_600_000;
const CODE_TTL = 5 * 60_000;
const COMPLAINT_TYPES = { bug: "مشكلة تقنية", suggestion: "اقتراح", account: "حساب / تنصيب", other: "أخرى" };
const COMPLAINT_STATUS = ["new", "review", "resolved"];
const ACTIVE_STATES = new Set(["connected", "stopped"]);

export function createApp({ cfg, store, adapter }) {
  const db = store.data;
  const hub = createHub();
  const limiter = createLimiter();
  const loginLock = createLockout(5, 15 * 60_000);
  const devLock = createLockout(5, 15 * 60_000);
  const codes = new Map();       // phone -> { hash, exp }
  const watches = new Map();     // token -> { phone, exp, last: [event, data] | null }
  const chatLast = new Map();    // uid -> ts آخر رسالة

  const extraBad = cfg.extraBadWordsFile && fs.existsSync(cfg.extraBadWordsFile)
    ? fs.readFileSync(cfg.extraBadWordsFile, "utf8").split(/\r?\n/).map((s) => s.trim()).filter(Boolean) : [];
  const badWords = [...BAD_WORDS, ...extraBad].map((w) => normalizeArabic(w).trim());

  // ───────── أدوات مساعدة ─────────
  const now = () => Date.now();
  const botId = (phone) => sha256("bot:" + phone + cfg.sessionSecret).slice(0, 12);
  const botByPhone = (phone) => db.bots[phone];
  const botById = (id) => Object.values(db.bots).find((b) => b.id === id);
  const stateOf = (phone) => adapter.state(phone);
  const isActive = (phone) => ACTIVE_STATES.has(stateOf(phone));

  function logEvent(type, phone, detail = "") {
    db.events.push({ id: store.nextId(), ts: now(), type, phone: phone ? maskPhone(phone) : "", detail });
    if (db.events.length > 1000) db.events.splice(0, db.events.length - 1000);
    store.save();
    hub.publish("dev", "event", db.events[db.events.length - 1]);
  }

  const sessionKey = (sid) => sha256(sid);
  function createSession(req, res, role, phone) {
    const sid = randomToken(32);
    const ttl = role === "dev" ? DEV_TTL : OWNER_TTL;
    db.sessions[sessionKey(sid)] = { role, phone: phone || null, exp: now() + ttl, createdAt: now() };
    store.save();
    setCookie(req, res, cfg, role === "dev" ? "md" : "ms", signValue(cfg.sessionSecret, sid), Math.floor(ttl / 1000));
  }
  function readSession(req, role) {
    const raw = parseCookies(req.headers.cookie)[role === "dev" ? "md" : "ms"];
    const sid = unsignValue(cfg.sessionSecret, raw);
    if (!sid) return null;
    const s = db.sessions[sessionKey(sid)];
    if (!s || s.role !== role || s.exp < now()) return null;
    // تمديد منزلق
    const ttl = role === "dev" ? DEV_TTL : OWNER_TTL;
    if (s.exp - now() < ttl / 2) { s.exp = now() + ttl; store.save(); }
    return { sid, ...s };
  }
  const destroySession = (sid) => { delete db.sessions[sessionKey(sid)]; store.save(); };
  function revokeOwnerSessions(phone) {
    let n = 0;
    for (const [k, s] of Object.entries(db.sessions)) if (s.role === "owner" && s.phone === phone) { delete db.sessions[k]; n++; }
    store.save();
    return n;
  }
  function forceLogout(phone, reason) {
    const n = revokeOwnerSessions(phone);
    hub.publish(`owner:${phone}`, "forced-logout", { reason });
    hub.close(`owner:${phone}`);
    logEvent("forced_logout", phone, `${reason} (جلسات ملغاة: ${n})`);
  }

  // ───────── أحداث البوت (pair / ready / close / badSession) ─────────
  const watchersOf = (phone) => [...watches.entries()].filter(([, w]) => w.phone === phone);
  function toWatchers(phone, event, data) {
    for (const [t, w] of watchersOf(phone)) { w.last = [event, data]; hub.publish(`watch:${t}`, event, data); }
  }
  adapter.on("pair", ({ phone, code }) => {
    if (!botByPhone(phone)) return;
    logEvent("pair_code_shown", phone);
    toWatchers(phone, "pair", { code: code || cfg.pairCode });
  });
  adapter.on("ready", ({ phone }) => {
    const b = botByPhone(phone);
    if (!b) return;
    b.status = "connected"; b.connectedAt = now(); b.updatedAt = now();
    store.save();
    logEvent("bot_ready", phone);
    toWatchers(phone, "ready", { message: "✅ تم ربط بوتك بنجاح" });
    hub.publish(`owner:${phone}`, "status", { status: "connected" });
  });
  async function onDisconnect(phone, kind) {
    const b = botByPhone(phone);
    if (!b) return;
    b.status = "disconnected"; b.updatedAt = now();
    store.save();
    if (kind === "badSession") {
      try { await adapter.cleanSession(phone); } catch (e) { logEvent("clean_session_failed", phone, e.message); }
    }
    forceLogout(phone, kind);
    toWatchers(phone, "close", { kind });
  }
  adapter.on("close", ({ phone }) => onDisconnect(phone, "close"));
  adapter.on("badSession", ({ phone }) => onDisconnect(phone, "badSession"));

  // ───────── التطبيق ─────────
  const app = express();
  app.disable("x-powered-by");
  app.set("trust proxy", cfg.trustProxy);

  app.use((req, res, next) => {
    res.setHeader("X-Content-Type-Options", "nosniff");
    res.setHeader("X-Frame-Options", "DENY");
    res.setHeader("Referrer-Policy", "no-referrer");
    res.setHeader("Permissions-Policy", "camera=(), microphone=(), geolocation=()");
    res.setHeader("Content-Security-Policy",
      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; " +
      "font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; " +
      "frame-ancestors 'none'; base-uri 'none'; form-action 'self'");
    if (req.secure) res.setHeader("Strict-Transport-Security", "max-age=31536000; includeSubDomains");
    next();
  });

  app.use("/api", express.json({ limit: "20kb" }));
  app.use("/api/chat/join", express.json({ limit: "160kb" }));

  // حماية CSRF: طلبات التعديل يجب أن تأتي من نفس الأصل.
  app.use("/api", (req, res, next) => {
    if (["GET", "HEAD", "OPTIONS"].includes(req.method)) return next();
    const origin = req.headers.origin;
    if (origin) {
      let ok = false;
      try { ok = new URL(origin).host === req.headers.host || cfg.allowedOrigins.includes(origin); } catch { /* مرفوض */ }
      if (!ok) return res.status(403).json({ error: "ORIGIN", message: "طلب مرفوض (أصل غير مسموح)." });
    } else if (req.headers["sec-fetch-site"] === "cross-site") {
      return res.status(403).json({ error: "ORIGIN", message: "طلب مرفوض." });
    }
    next();
  });

  const limit = (name, n, windowMs, keyFn = (req) => req.ip) => (req, res, next) => {
    const r = limiter.hit(`${name}:${keyFn(req)}`, n, windowMs);
    if (r.ok) return next();
    res.setHeader("Retry-After", r.retryAfter);
    res.status(429).json({ error: "RATE_LIMIT", message: "طلبات كثيرة، حاول لاحقاً.", retryAfter: r.retryAfter });
  };
  const bad = (res, status, error, message, extra = {}) => res.status(status).json({ error, message, ...extra });

  const requireOwner = (req, res, next) => {
    const s = readSession(req, "owner");
    if (!s) return bad(res, 401, "UNAUTH", "سجّل الدخول أولاً.");
    const st = stateOf(s.phone);
    if (!botByPhone(s.phone) || !ACTIVE_STATES.has(st)) {
      destroySession(s.sid);
      clearCookie(req, res, cfg, "ms");
      return bad(res, 401, "DISCONNECTED", "البوت منفصل ⚠️ — أعد التنصيب", { disconnected: true });
    }
    req.owner = { phone: s.phone, sid: s.sid };
    next();
  };
  const requireDev = (req, res, next) => {
    const s = readSession(req, "dev");
    if (!s) return bad(res, 401, "UNAUTH", "دخول المطور مطلوب.");
    req.dev = { sid: s.sid };
    next();
  };

  // ───────── عام ─────────
  app.get("/api/health", (req, res) => res.json({ ok: true }));

  app.get("/api/stats", (req, res) => {
    const bots = Object.values(db.bots);
    const active = bots.filter((b) => ACTIVE_STATES.has(stateOf(b.phone))).length;
    const registered = bots.length;
    res.json({
      total: cfg.maxBots,
      available: Math.max(0, cfg.maxBots - registered),
