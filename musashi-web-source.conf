    <div className="mu-step"><span className="mu-step-index">1</span><span>افتح واتساب على الهاتف الذي أدخلت رقمه.</span></div>
    <div className="mu-step"><span className="mu-step-index">2</span><span>اذهب إلى <b>الأجهزة المرتبطة</b> من الإعدادات أو قائمة ⋮.</span></div>
    <div className="mu-step"><span className="mu-step-index">3</span><span>اضغط <b>ربط جهاز</b> ثم <b>الربط برقم الهاتف بدلاً من ذلك</b>.</span></div>
    <div className="mu-step"><span className="mu-step-index">4</span><span>أدخل <b>رمز الإقران</b> الظاهر في الموقع (8 حروف/أرقام).</span></div>
