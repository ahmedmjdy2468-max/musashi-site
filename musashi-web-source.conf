test("لوحة المطور: كلمة سر، قفل 5 محاولات، قوائم، إعلان، حذف رسالة وكتم، حذف بوت", async () => {
  const s = await boot(); const d = s.client(); const u = s.client();
  assert.equal((await d.get("/api/dev/stats")).status, 401);
  for (let i = 0; i < 4; i++) assert.equal((await d.post("/api/dev/login", { password: "wrong" })).status, 401);
  assert.equal((await d.post("/api/dev/login", { password: "wrong" })).status, 423);
  assert.equal((await d.post("/api/dev/login", { password: PW })).status, 423);
  s.close();

  const s2 = await boot(); const d2 = s2.client(); const o = s2.client(); const u2 = s2.client();
  assert.equal((await d2.post("/api/dev/login", { password: PW })).status, 200);
  await install(s2, o); 
  const bots = await d2.get("/api/dev/bots");
  assert.equal(bots.json.items[0].phone, "+968***567"); assert.ok(!JSON.stringify(bots.json).includes(PHONE));
  const ann = await d2.post("/api/dev/announcements", { text: "تحديث جديد 🎉" });
  assert.equal((await u2.get("/api/announcements")).json.items[0].text, "تحديث جديد 🎉");
  assert.equal((await u2.get("/api/channel")).json.announcements.length, 1);
  await u2.post("/api/chat/join", { name: "سالم" });
  await u2.post("/api/chat/send", { text: "اهلا" });
  const msg = s2.store.data.chat[0];
  await d2.post("/api/dev/chat/mute", { uid: msg.uid, minutes: 10 });
  assert.equal((await u2.post("/api/chat/send", { text: "ثانية" })).status, 403);
  await d2.del(`/api/dev/chat/${msg.id}`);
  assert.equal(s2.store.data.chat.length, 0);
  assert.ok((await d2.get("/api/dev/events")).json.items.length > 3);
  const stats = await d2.get("/api/dev/stats");
  assert.equal(stats.json.active, 1);
  await d2.del(`/api/dev/bots/${bots.json.items[0].id}`);
  assert.equal((await d2.get("/api/dev/bots")).json.items.length, 0);
  s2.close();
});

