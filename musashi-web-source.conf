      disconnected: bots.filter((b) => ["disconnected", "none"].includes(stateOf(b.phone)) && b.status !== "pairing").length,
    });
  });

  app.get("/api/announcements", (req, res) =>
    res.json({ items: db.announcements.slice(-20).reverse() }));
  app.get("/api/channel", (req, res) =>
    res.json({ url: cfg.channelUrl || null, announcements: db.announcements.slice(-10).reverse() }));

  app.get("/api/commands", (req, res) => {
    const cats = adapter.commands() || [];
    res.json({ total: cats.reduce((n, c) => n + c.commands.length, 0),
      categories: cats.map((c) => ({ id: c.id, icon: c.icon, title: c.title, count: c.commands.length })) });
  });
  app.get("/api/commands/:id", (req, res) => {
