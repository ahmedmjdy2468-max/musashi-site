test("دخول: كود 6 أرقام، استخدام واحد، جلسة HttpOnly باقية", async () => {
  const s = await boot(); const c = s.client();
  await install(s, c);
  const req = await c.post("/api/auth/request", { phone: PHONE });
  assert.equal(req.status, 200);
  const code = s.adapter.lastCode(PHONE);
  assert.ok(s.adapter.outbox.at(-1).text.includes(code));
  const ok = await c.post("/api/auth/verify", { phone: PHONE, code });
  assert.equal(ok.status, 200);
  const setCookie = ok.headers.getSetCookie().join(";");
  assert.match(setCookie, /HttpOnly/); assert.match(setCookie, /SameSite=Lax/);
  assert.equal((await c.get("/api/me")).json.authenticated, true);
  assert.equal((await c.get("/api/owner/dashboard")).status, 200);
  // replay من عميل آخر بنفس الكود
  const c2 = s.client();
  assert.equal((await c2.post("/api/auth/verify", { phone: PHONE, code })).status, 401);
  s.close();
});

