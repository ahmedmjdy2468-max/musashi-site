async function shrinkAvatar(file: File): Promise<string> {
  const bmp = await createImageBitmap(file);
  const c = document.createElement("canvas"); c.width = c.height = 96;
  const x = c.getContext("2d")!; const s = Math.min(bmp.width, bmp.height);
  x.drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, 96, 96);
  return c.toDataURL("image/jpeg", 0.8);
}
const Avatar = ({ src, name }: { src?: string; name: string }) =>
  src ? <img className="mu-avatar" src={src} alt="" /> : <span className="mu-avatar ph">{name.slice(0, 1)}</span>;

export function GroupChatPage() {
  const [me, setMe] = useState<J | null | undefined>(undefined);
  const [name, setName] = useState("");
  const [avatar, setAvatar] = useState("");
  const [msgs, setMsgs] = useState<J[]>([]);
  const [text, setText] = useState("");
  const [err, setErr] = useState("");
  const end = useRef<HTMLDivElement>(null);

  useEffect(() => { get("/api/chat/me").then((r) => setMe(r.joined ? r.me : null)).catch(() => setMe(null)); }, []);
  useEffect(() => {
    if (!me) return;
    return listen("/api/chat/stream", {
      history: (d) => setMsgs(d.messages),
      message: (m) => setMsgs((l) => [...l.slice(-199), m]),
      delete: (d) => setMsgs((l) => l.filter((m) => m.id !== d.id)),
    });
  }, [me]);
  useEffect(() => { end.current?.scrollIntoView({ block: "end" }); }, [msgs.length]);

  const join = async (e: FormEvent) => {
    e.preventDefault(); setErr("");
    try { const r = await post("/api/chat/join", { name, avatar }); setMe(r.me); } catch (x) { setErr(errMsg(x)); }
  };
  const send = async (e: FormEvent) => {
    e.preventDefault(); const t = text.trim(); if (!t) return; setErr("");
    try { await post("/api/chat/send", { text: t }); setText(""); } catch (x) { setErr(errMsg(x)); }
  };

  return (
    <section className="mu-page">
      <Head eyebrow="GROUP CHAT" title="الشات الجماعي" text="غرفة لحظية لمجتمع البوت. الروابط والألفاظ المسيئة ممنوعة." />
      {me === undefined ? null : !me ? (
        <form className="mu-panel mu-panel-inner mu-login" onSubmit={join}>
          <div className="mu-panel-title"><h2>ادخل الغرفة</h2></div>
          <label className="mu-field-label" htmlFor="mu-chat-name">اسمك (2–24 حرفاً)</label>
          <input className="mu-phone-input" id="mu-chat-name" maxLength={24} value={name} onChange={(e) => setName(e.currentTarget.value)} required />
          <label className="mu-field-label" htmlFor="mu-chat-av">صورة (اختيارية)</label>
          <div className="mu-actions-row" style={{ alignItems: "center" }}>
            <input id="mu-chat-av" type="file" accept="image/png,image/jpeg,image/webp" onChange={async (e) => { const f = e.currentTarget.files?.[0]; if (f) { try { setAvatar(await shrinkAvatar(f)); } catch { setErr("تعذّر قراءة الصورة."); } } }} />
            {avatar && <Avatar src={avatar} name={name || "؟"} />}
          </div>
          <Err text={err} />
          <div className="mu-actions-row" style={{ marginTop: 12 }}><button className="mu-btn-primary" type="submit" disabled={name.trim().length < 2}>دخول</button></div>
        </form>
      ) : (
        <div className="mu-panel mu-chat-room">
          <div className="mu-chat-list" role="log" aria-live="polite">
            {msgs.length === 0 && <Empty symbol="💬" title="الغرفة هادئة" text="كن أول من يكتب." />}
            {msgs.map((m) => (
              <div key={m.id} className={`mu-msg ${m.uid === me.id ? "mine" : ""} ${m.dev ? "dev" : ""}`}>
                <Avatar src={m.avatar} name={m.name} />
                <div className="mu-bubble">
                  <div className="mu-msg-meta"><b>{m.name}</b>{m.phone && <span dir="ltr">{m.phone}</span>}<time>{fmtTime(m.ts)}</time></div>
                  <p>{m.text}</p>
                </div>
              </div>
            ))}
            <div ref={end} />
          </div>
          <form className="mu-chat-compose" onSubmit={send}>
            <input className="mu-phone-input" maxLength={300} value={text} onChange={(e) => setText(e.currentTarget.value)} placeholder="اكتب رسالة…" aria-label="رسالة" />
            <button className="mu-btn-primary" type="submit" disabled={!text.trim()}>إرسال</button>
          </form>
          <Err text={err} />
        </div>
      )}
    </section>
  );
}

