  // ───────── أخطاء ─────────
  app.use((err, req, res, next) => {
    if (err.type === "entity.too.large") return bad(res, 413, "TOO_LARGE", "الطلب كبير جداً.");
    if (err instanceof SyntaxError) return bad(res, 400, "JSON", "JSON غير صالح.");
    console.error("[error]", err);
    bad(res, 500, "INTERNAL", "خطأ داخلي.");
  });

  // تنظيف دوري
  const sweep = setInterval(() => {
    const t = now();
    for (const [k, s] of Object.entries(db.sessions)) if (s.exp < t) delete db.sessions[k];
    for (const [k, w] of watches) if (w.exp < t) { watches.delete(k); hub.close(`watch:${k}`); }
    for (const [k, c] of codes) if (c.exp < t) codes.delete(k);
    store.save();
  }, 60_000);
  sweep.unref();

  return { app, hub, dispose: () => clearInterval(sweep) };
}


