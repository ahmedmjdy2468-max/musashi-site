type Tab = "overview" | "bots" | "complaints" | "chats" | "announce" | "chat" | "events";
const TABS: [Tab, string][] = [["overview", "نظرة عامة"], ["bots", "البوتات"], ["complaints", "الشكاوى"], ["chats", "المحادثات"], ["announce", "الإعلانات"], ["chat", "الشات"], ["events", "السجل"]];

export function DevConsolePage({ toast }: Common) {
  const [auth, setAuth] = useState<boolean | null>(null);
  const [enabled, setEnabled] = useState(true);
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [tab, setTab] = useState<Tab>("overview");
  useEffect(() => { get("/api/dev/me").then((r) => { setAuth(r.authenticated); setEnabled(r.enabled); }).catch(() => setAuth(false)); }, []);
  const login = async (e: FormEvent) => {
    e.preventDefault(); setErr("");
    try { await post("/api/dev/login", { password: pw }); setPw(""); setAuth(true); } catch (x) { setErr(errMsg(x)); }
  };
  return (
    <section className="mu-page">
      <Head eyebrow="RESTRICTED ACCESS" title="لوحة المطور" text="إدارة البوتات والشكاوى والمحادثات والإعلانات."
        aside={auth ? <button className="mu-btn-quiet" type="button" onClick={async () => { await post("/api/dev/logout"); setAuth(false); }}>خروج</button> : undefined} />
      {auth === null ? null : !auth ? (
        <form className="mu-panel mu-panel-inner mu-login" onSubmit={login}>
          <div className="mu-panel-title"><h2>🔐 دخول المطور</h2></div>
          {!enabled && <div className="mu-form-error">لوحة المطور غير مفعّلة: اضبط DEV_PASSWORD_HASH في الخادم.</div>}
          <label className="mu-field-label" htmlFor="mu-dev-pw">كلمة السر</label>
          <div className="mu-phone-wrap"><input className="mu-phone-input" id="mu-dev-pw" type="password" autoComplete="current-password" value={pw} onChange={(e) => setPw(e.currentTarget.value)} required />
            <button className="mu-btn-primary" type="submit" disabled={!pw || !enabled}>دخول</button></div>
          <Err text={err} />
        </form>
      ) : (
        <>
          <div className="mu-tabs" role="tablist">{TABS.map(([id, label]) => <button key={id} role="tab" aria-selected={tab === id} className={tab === id ? "on" : ""} type="button" onClick={() => setTab(id)}>{label}</button>)}</div>
          {tab === "overview" && <DevOverview />}
          {tab === "bots" && <DevBots toast={toast} />}
          {tab === "complaints" && <DevComplaints toast={toast} />}
          {tab === "chats" && <DevChats toast={toast} />}
          {tab === "announce" && <DevAnnounce toast={toast} />}
          {tab === "chat" && <DevChatMod toast={toast} />}
          {tab === "events" && <DevEvents />}
        </>
      )}
    </section>
  );
}

function useList<T = J>(url: string, key = "items") {
  const [items, setItems] = useState<T[]>([]);
  const reload = () => get(url).then((r) => setItems(r[key])).catch(() => {});
  useEffect(() => { void reload(); }, [url]); // eslint-disable-line react-hooks/exhaustive-deps
  return [items, reload] as const;
}

function DevOverview() {
  const [s, setS] = useState<J | null>(null);
  useEffect(() => { get("/api/dev/stats").then(setS).catch(() => {}); }, []);
  const cards: [string, string, unknown][] = [["إجمالي البوتات", "◈", s?.bots], ["مفعّلة", "◉", s?.active], ["منفصلة", "⚠", s?.disconnected], ["شكاوى جديدة", "📮", s?.complaintsNew], ["رسائل الشات", "💬", s?.chatMessages]];
  return <div className="mu-grid-3">{cards.map(([l, i, v]) => <div className="mu-panel mu-stat" key={l}><span className="mu-stat-icon">{i}</span><span className="mu-stat-label">{l}</span><strong className="mu-stat-value live">{s ? String(v) : "—"}</strong></div>)}</div>;
}

function DevBots({ toast }: { toast: (m: string) => void }) {
  const [items, reload] = useList("/api/dev/bots");
  const act = async (id: string, a: "stop" | "start") => { try { await post(`/api/dev/bots/${id}/${a}`); toast("تم."); void reload(); } catch (e) { toast(errMsg(e)); } };
  const rm = async (id: string) => { if (!confirm("حذف هذا البوت من الموقع؟ سيُخرَج مالكه فوراً.")) return; try { await del(`/api/dev/bots/${id}`); void reload(); } catch (e) { toast(errMsg(e)); } };
  return (
    <div className="mu-panel mu-panel-inner">
      <div className="mu-panel-title"><h2>البوتات</h2><small>{items.length}</small></div>
      {items.length === 0 ? <Empty symbol="◈" title="لا بوتات" text="لم يُنصَّب أي بوت بعد." /> : (
        <ul className="mu-rows">{items.map((b: J) => (
          <li key={b.id}><span dir="ltr">{b.phone}</span><span className={`mu-chip st-${b.state}`}>{STATE_LABEL[b.state] ?? b.state}</span><time>{fmtDate(b.createdAt)}</time>
            <span className="mu-actions-row">
              {b.state === "stopped" ? <button className="mu-btn-quiet" type="button" onClick={() => void act(b.id, "start")}>تشغيل</button> : <button className="mu-btn-quiet" type="button" onClick={() => void act(b.id, "stop")}>إيقاف</button>}
              <button className="mu-btn-quiet danger" type="button" onClick={() => void rm(b.id)}>حذف</button></span></li>))}
        </ul>)}
    </div>
  );
}

function DevComplaints({ toast }: { toast: (m: string) => void }) {
  const [items, reload] = useList("/api/dev/complaints");
  const [reply, setReply] = useState<Record<number, string>>({});
  const save = async (id: number, body: J) => { try { await patch(`/api/dev/complaints/${id}`, body); toast("تم الحفظ."); setReply((r) => ({ ...r, [id]: "" })); void reload(); } catch (e) { toast(errMsg(e)); } };
  return (
    <div className="mu-panel mu-panel-inner">
      <div className="mu-panel-title"><h2>صندوق الشكاوى</h2><small>{items.length}</small></div>
      {items.length === 0 ? <Empty symbol="📮" title="لا شكاوى" text="الصندوق فارغ." /> : (
        <ul className="mu-ticket-list">{items.map((c: J) => (
          <li key={c.id}>
            <div className="mu-ticket-head"><b>{c.typeLabel}{c.phone ? ` · ${c.phone}` : ""}</b>
              <select className="mu-mini-select" value={c.status} onChange={(e) => void save(c.id, { status: e.currentTarget.value })}>{Object.entries(STATUS_AR).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></div>
            <p>{c.text}</p>{c.contact && <small>تواصل: <span dir="ltr">{c.contact}</span></small>}
            {c.reply && <div className="mu-dev-reply"><b>ردك:</b> {c.reply}</div>}
            <div className="mu-chat-compose"><input className="mu-phone-input" placeholder="اكتب رداً…" value={reply[c.id] ?? ""} onChange={(e) => { const v = e.currentTarget.value; setReply((r) => ({ ...r, [c.id]: v })); }} />
              <button className="mu-btn-secondary" type="button" disabled={!reply[c.id]?.trim()} onClick={() => void save(c.id, { reply: reply[c.id] })}>رد</button></div>
            <small>{fmtDate(c.ts)}</small>
          </li>))}
        </ul>)}
    </div>
  );
}

function DevChats({ toast }: { toast: (m: string) => void }) {
  const [items, reload] = useList("/api/dev/chats");
  const [sel, setSel] = useState<J | null>(null);
  const [msgs, setMsgs] = useState<J[]>([]);
  const [text, setText] = useState("");
  const open = async (c: J) => { setSel(c); setMsgs((await get(`/api/dev/chats/${c.botId}`)).messages); };
  const send = async (e: FormEvent) => {
    e.preventDefault(); if (!sel || !text.trim()) return;
    try { const r = await post(`/api/dev/chats/${sel.botId}`, { text }); setMsgs((l) => [...l, r.message]); setText(""); void reload(); } catch (x) { toast(errMsg(x)); }
  };
  return (
    <div className="mu-install-grid">
      <div className="mu-panel mu-panel-inner"><div className="mu-panel-title"><h2>المحادثات الخاصة</h2></div>
        {items.length === 0 ? <Empty symbol="⌁" title="لا محادثات" text="لم يراسلك أحد بعد." /> :
          <ul className="mu-rows">{items.map((c: J) => <li key={c.botId}><button type="button" className="mu-btn-quiet" onClick={() => void open(c)}><span dir="ltr">{c.phone}</span> · {c.count}</button><small>{c.last.text.slice(0, 40)}</small></li>)}</ul>}
      </div>
      <div className="mu-panel mu-chat-room">
        {!sel ? <Empty symbol="💬" title="اختر محادثة" text="" /> : <>
          <div className="mu-chat-list">{msgs.map((m) => <div key={m.id} className={`mu-msg ${m.from === "dev" ? "mine dev" : ""}`}><div className="mu-bubble"><div className="mu-msg-meta"><b>{m.from === "dev" ? "أنت" : sel.phone}</b><time>{fmtTime(m.ts)}</time></div><p>{m.text}</p></div></div>)}</div>
          <form className="mu-chat-compose" onSubmit={send}><input className="mu-phone-input" value={text} onChange={(e) => setText(e.currentTarget.value)} maxLength={1000} placeholder="رد…" /><button className="mu-btn-primary" type="submit">إرسال</button></form></>}
      </div>
    </div>
  );
}

function DevAnnounce({ toast }: { toast: (m: string) => void }) {
  const [items, reload] = useList("/api/announcements");
  const [text, setText] = useState("");
  const add = async (e: FormEvent) => { e.preventDefault(); try { await post("/api/dev/announcements", { text }); setText(""); void reload(); toast("نُشر الإعلان."); } catch (x) { toast(errMsg(x)); } };
  return (
    <div className="mu-panel mu-panel-inner">
      <div className="mu-panel-title"><h2>الإعلانات</h2></div>
      <form className="mu-chat-compose" onSubmit={add}><input className="mu-phone-input" maxLength={500} value={text} onChange={(e) => setText(e.currentTarget.value)} placeholder="نص الإعلان…" /><button className="mu-btn-primary" type="submit" disabled={!text.trim()}>نشر</button></form>
      <ul className="mu-ticket-list" style={{ marginTop: 14 }}>{items.map((a: J) => <li key={a.id}><p>{a.text}</p><small>{fmtDate(a.ts)}</small> <button className="mu-btn-quiet danger" type="button" onClick={async () => { await del(`/api/dev/announcements/${a.id}`); void reload(); }}>حذف</button></li>)}</ul>
    </div>
  );
}

function DevChatMod({ toast }: { toast: (m: string) => void }) {
  const [msgs, reload] = useList("/api/dev/chat/messages");
  const rm = async (id: number) => { try { await del(`/api/dev/chat/${id}`); void reload(); } catch (x) { toast(errMsg(x)); } };
  const mute = async (uid: string, minutes: number) => { try { await post("/api/dev/chat/mute", { uid, minutes }); toast(minutes ? `كُتم ${minutes} دقيقة.` : "كُتم دائماً."); } catch (x) { toast(errMsg(x)); } };
  return (
    <div className="mu-panel mu-panel-inner">
      <div className="mu-panel-title"><h2>إشراف الشات</h2><button className="mu-btn-quiet" type="button" onClick={() => void reload()}>تحديث</button></div>
      {msgs.length === 0 ? <Empty symbol="💬" title="لا رسائل" text="" /> : (
        <ul className="mu-rows">{msgs.map((m: J) => (
          <li key={m.id}><b>{m.name}</b><span>{m.text}</span>
            <span className="mu-actions-row"><button className="mu-btn-quiet" type="button" onClick={() => void mute(m.uid, 60)}>كتم ساعة</button><button className="mu-btn-quiet" type="button" onClick={() => void mute(m.uid, 0)}>كتم دائم</button><button className="mu-btn-quiet danger" type="button" onClick={() => void rm(m.id)}>حذف</button></span></li>))}
        </ul>)}
    </div>
  );
}

function DevEvents() {
  const [items] = useList("/api/dev/events");
  return (
    <div className="mu-panel mu-panel-inner"><div className="mu-panel-title"><h2>سجل الأحداث الكامل</h2><small>{items.length}</small></div>
      <ul className="mu-log">{items.map((e: J) => <li key={e.id}><time>{fmtDate(e.ts)}</time><span>{EVENT_AR[e.type] ?? e.type}</span><small dir="ltr">{e.phone}</small>{e.detail && <small>{e.detail}</small>}</li>)}</ul></div>
  );
}


