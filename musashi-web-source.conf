                          onClick={() => { setUploadScene(""); try { localStorage.removeItem("musashi-custom-bg"); } catch { /* تجاهل */ } setSceneId(scene.id); }}
                        ><span>{scene.label}</span></button>
                      ))}
                      <label className="mu-scene-upload">＋<br />رفع صورة<input type="file" accept="image/*" onChange={(e) => void uploadBackground(e)} /></label>
                    </div>
                    {uploadScene && <div className="mu-small-print">تُعرض الصورة المرفوعة في هذه الجلسة فقط.</div>}
                    <label className="mu-range-row"><span>سطوع المشهد</span><input type="range" min="35" max="100" value={brightness} onChange={(event) => setBrightness(Number(event.currentTarget.value))} /><span className="mu-range-value">{brightness}%</span></label>
