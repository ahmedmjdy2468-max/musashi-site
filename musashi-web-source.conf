  --faint: #716a7b;
  --line: rgba(232, 217, 255, 0.105);
  --line-strong: rgba(232, 217, 255, 0.19);
  --accent: #c5a0ff;
  --accent-strong: #986ae8;
  --accent-wash: rgba(164, 119, 235, 0.14);
  --gold: #d9bd78;
  --gold-wash: rgba(217, 189, 120, 0.13);
  --success: #86c5a1;
  --warning: #e0b972;
  --danger: #d98991;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 76% -8%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 34rem),
    var(--bg);
  font-family: "Cairo", sans-serif;
  direction: rtl;
  position: relative;
  overflow: clip;
  isolation: isolate;
}

.mu::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.16;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.14'/%3E%3C/svg%3E");
}

.mu[data-palette="wisteria"] { --accent:#c5a0ff; --accent-strong:#986ae8; --accent-wash:rgba(164,119,235,.14); }
.mu[data-palette="amethyst"] { --accent:#d1a7f2; --accent-strong:#aa71cf; --accent-wash:rgba(180,112,220,.14); }
.mu[data-palette="saffron"] { --accent:#e2bd75; --accent-strong:#c59a4b; --accent-wash:rgba(216,179,102,.14); }
.mu[data-palette="jade"] { --accent:#8ac2a6; --accent-strong:#559b78; --accent-wash:rgba(100,175,135,.14); }
.mu[data-palette="indigo"] { --accent:#9cafe0; --accent-strong:#7184ba; --accent-wash:rgba(119,142,205,.15); }
.mu[data-palette="rose"] { --accent:#df9ab5; --accent-strong:#c56c8d; --accent-wash:rgba(205,111,145,.14); }
.mu[data-palette="copper"] { --accent:#d89775; --accent-strong:#bd704e; --accent-wash:rgba(198,111,77,.15); }
.mu[data-palette="ice"] { --accent:#9cc8d1; --accent-strong:#62a2ad; --accent-wash:rgba(103,174,187,.14); }
.mu[data-palette="plum"] { --accent:#ca9dc5; --accent-strong:#a56a9d; --accent-wash:rgba(171,105,162,.15); }
.mu[data-palette="moon"] { --accent:#c3c5df; --accent-strong:#8f92b8; --accent-wash:rgba(144,148,190,.15); }

.mu[data-mode="light"] {
  --bg: #eee9f3;
  --surface: #f8f5fa;
  --surface-raised: #fffaff;
  --surface-soft: rgba(45, 28, 61, 0.035);
  --ink: #281f31;
  --muted: #6d6275;
  --faint: #8e8395;
  --line: rgba(56, 38, 69, 0.1);
  --line-strong: rgba(56, 38, 69, 0.18);
  --shadow: 0 20px 60px rgba(55, 37, 72, 0.1);
  background:
    radial-gradient(ellipse at 76% -8%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 34rem),
    var(--bg);
}

.mu * { box-sizing: border-box; }
.mu button, .mu input, .mu textarea { font: inherit; }
.mu button { color: inherit; }
.mu button:focus-visible, .mu input:focus-visible, .mu textarea:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.mu-shell { min-height: 100vh; display: grid; grid-template-columns: 258px minmax(0, 1fr); position: relative; z-index: 1; }
.mu-backdrop-art {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  opacity: .18; color: var(--accent);
}
.mu-backdrop-art svg { width: 100%; height: 100%; min-width: 900px; }
.mu-backdrop-moon { fill: rgba(220, 190, 130, .12); stroke: rgba(220, 190, 130, .28); stroke-width: 1.2; }
.mu-backdrop-line { fill: none; stroke: rgba(196, 164, 226, .42); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mu-backdrop-fine { fill: none; stroke: rgba(225, 205, 158, .38); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.mu-backdrop-silhouette { fill: rgba(19, 13, 27, .56); stroke: rgba(196, 164, 226, .3); stroke-width: 1.2; stroke-linejoin: round; }
.mu-backdrop-star { fill: rgba(226, 205, 160, .48); }
.mu-backdrop-ground { fill: none; stroke: rgba(196, 164, 226, .26); stroke-width: 1.5; stroke-linecap: round; }
.mu-sidebar {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  padding: 25px 18px 19px; border-left: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  backdrop-filter: blur(24px); z-index: 12;
}
.mu-brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 23px; border-bottom: 1px solid var(--line); }
.mu-brand-mark {
  width: 42px; height: 42px; display:grid; place-items:center; border:1px solid color-mix(in srgb,var(--gold) 45%, transparent);
  color:var(--gold); border-radius:13px 13px 13px 4px; background:var(--gold-wash); font-size:21px;
}
.mu-brand-title { font-size:15px; font-weight:800; letter-spacing:.07em; direction:ltr; text-align:right; }
.mu-brand-title span { color:var(--gold); }
.mu-brand-tag { margin-top:1px; color:var(--muted); font-size:10px; }
.mu-preview-label {
  display:flex; align-items:center; justify-content:space-between; margin:19px 2px 11px; padding:8px 10px;
  border:1px solid rgba(217,189,120,.24); border-radius:9px; color:var(--gold); background:var(--gold-wash);
  font-size:10px; font-weight:700; letter-spacing:.06em;
}
.mu-preview-label i { width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px rgba(217,189,120,.1); }
.mu-nav-label { padding:0 10px; margin:11px 0 7px; color:var(--faint); font-size:10px; font-weight:700; letter-spacing:.14em; }
.mu-nav { display:grid; gap:4px; }
.mu-nav-item {
  width:100%; display:flex; align-items:center; gap:10px; text-align:right; border:1px solid transparent;
  border-radius:10px; background:transparent; padding:9px 10px; color:var(--muted); cursor:pointer;
  font-size:12px; transition:background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
}
.mu-nav-item:hover { color:var(--ink); background:var(--surface-soft); transform:translateX(-2px); }
.mu-nav-item[aria-current="page"] { color:var(--ink); background:var(--accent-wash); border-color:color-mix(in srgb,var(--accent) 23%, transparent); }
.mu-nav-icon { display:grid; place-items:center; width:22px; flex:0 0 22px; font-size:14px; }
.mu-nav-current { width:5px; height:5px; border-radius:50%; background:var(--gold); margin-right:auto; }
.mu-sidebar-foot { margin-top:auto; padding:14px 10px 0; border-top:1px solid var(--line); }
.mu-sidebar-foot strong { display:block; font-size:11px; font-weight:600; }
.mu-sidebar-foot span { display:block; margin-top:4px; color:var(--faint); font-size:10px; }

.mu-main { min-width:0; padding:0 34px 44px; }
.mu-topbar { min-height:77px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); }
.mu-crumb { color:var(--muted); font-size:11px; }
.mu-crumb b { color:var(--ink); font-weight:600; }
.mu-top-actions { display:flex; align-items:center; gap:10px; }
.mu-live-pill, .mu-preview-pill { display:flex; align-items:center; gap:7px; padding:7px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:10px; }
.mu-live-pill i { width:6px; height:6px; border-radius:50%; background:var(--faint); }
.mu-preview-pill { border-color:rgba(217,189,120,.27); color:var(--gold); background:var(--gold-wash); }
.mu-music-access {
  display:inline-flex; align-items:center; gap:7px; min-height:31px; padding:0 10px; border:1px solid var(--line);
  border-radius:999px; background:var(--surface-soft); color:var(--muted); cursor:pointer; font-size:9px;
}
.mu-music-access:hover { border-color:rgba(217,189,120,.34); color:var(--gold); }
.mu-menu-button { display:none; width:38px; height:38px; border:1px solid var(--line); border-radius:10px; background:var(--surface-soft); cursor:pointer; }
.mu-page { width:min(100%, 1110px); margin:0 auto; padding-top:30px; animation:mu-rise .35s ease both; }
@keyframes mu-rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.mu-page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:22px; margin:0 0 24px; }
.mu-eyebrow { color:var(--gold); font-family:"DM Mono",monospace; font-size:9px; letter-spacing:.18em; text-transform:uppercase; }
.mu-page-head h1 { margin:5px 0 3px; font-size:clamp(22px, 3vw, 30px); line-height:1.35; letter-spacing:-.04em; }
.mu-page-head p { margin:0; color:var(--muted); font-size:12px; }
.mu-note { display:flex; align-items:flex-start; gap:9px; padding:11px 13px; border:1px solid var(--line); background:var(--surface-soft); border-radius:10px; color:var(--muted); font-size:10px; line-height:1.8; }
.mu-note b { color:var(--gold); font-weight:700; }
.mu-note-symbol { color:var(--gold); font-family:"DM Mono",monospace; }

.mu-hero {
  min-height:294px; position:relative; display:grid; grid-template-columns:minmax(0,1.13fr) minmax(250px,.87fr);
  overflow:hidden; border:1px solid var(--line-strong); border-radius:19px; background:var(--surface);
  box-shadow:var(--shadow); isolation:isolate;
}
.mu-hero::before {
  content:""; position:absolute; inset:0; z-index:-2; opacity:var(--scene-opacity,.48);
  background-image:linear-gradient(90deg, color-mix(in srgb,var(--surface) 55%, transparent), var(--surface) 68%), var(--scene);
  background-position:center, center 44%; background-size:cover; filter:saturate(.72);
}
.mu-hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(135deg, transparent 45%, color-mix(in srgb,var(--accent) 8%,transparent)); pointer-events:none; }
.mu-hero-copy { padding:31px 34px 27px; align-self:center; position:relative; z-index:2; }
.mu-hero-title { max-width:470px; margin:12px 0 9px; font-size:clamp(24px,3.3vw,39px); line-height:1.4; letter-spacing:-.045em; }
.mu-hero-title em { color:var(--gold); font-style:normal; }
.mu-hero-copy p { max-width:470px; margin:0; color:var(--muted); font-size:12px; line-height:2; }
.mu-slogan { margin-top:12px; color:var(--gold); font-size:13px; font-weight:600; }
.mu-hero-actions { display:flex; align-items:center; gap:10px; margin-top:22px; flex-wrap:wrap; }
.mu-btn-primary, .mu-btn-secondary, .mu-btn-quiet {
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:41px; padding:0 16px;
  border-radius:10px; cursor:pointer; font-size:11px; font-weight:700; transition:transform .18s ease, background .18s ease, border-color .18s ease;
}
.mu-btn-primary { color:#241c2a!important; border:1px solid color-mix(in srgb,var(--gold) 75%, white); background:linear-gradient(135deg,#e4cf98,#c8a966); box-shadow:0 9px 22px rgba(184,148,74,.18); }
.mu-btn-primary:hover { transform:translateY(-2px); }
.mu-btn-secondary { color:var(--ink); border:1px solid var(--line-strong); background:rgba(255,255,255,.035); }
.mu-btn-secondary:hover, .mu-btn-quiet:hover { background:var(--accent-wash); }
.mu-btn-quiet { min-height:35px; color:var(--muted); border:1px solid var(--line); background:transparent; padding:0 12px; }
.mu-hero-art { min-width:0; position:relative; align-self:stretch; display:grid; place-items:center; overflow:hidden; }
.mu-hero-art::before { content:""; position:absolute; width:190px; height:190px; right:calc(50% - 86px); top:41px; border-radius:50%; background:radial-gradient(circle at 35% 40%,rgba(252,228,171,.34),rgba(199,165,255,.13) 42%,transparent 70%); filter:blur(9px); }
.mu-hero-art svg { width:min(100%,370px); height:auto; overflow:visible; opacity:.9; filter:drop-shadow(0 14px 24px rgba(0,0,0,.2)); }
.mu-sun { fill:rgba(234,208,145,.18); stroke:rgba(228,202,141,.6); stroke-width:1.3; }
.mu-art-line { fill:none; stroke:rgba(228,216,242,.66); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.mu-art-muted { fill:none; stroke:rgba(195,172,220,.48); stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }
.mu-art-gold { fill:none; stroke:rgba(225,197,132,.76); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.mu-art-fill { fill:rgba(30,22,39,.8); stroke:rgba(229,213,244,.58); stroke-width:1.2; stroke-linejoin:round; }
.mu-hero-art .star { fill:rgba(245,229,185,.7); }
.mu-hero-caption { position:absolute; bottom:16px; left:20px; color:var(--muted); font-family:"DM Mono",monospace; font-size:8px; letter-spacing:.1em; direction:ltr; }

.mu-panel { border:1px solid var(--line); border-radius:15px; background:color-mix(in srgb,var(--surface) 92%, transparent); box-shadow:0 12px 36px rgba(0,0,0,.08); }
.mu-install-grid { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(270px,.75fr); gap:16px; margin-top:17px; }
.mu-panel-inner { padding:20px; }
.mu-panel-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 14px; }
.mu-panel-title h2, .mu-panel-title h3 { margin:0; font-size:14px; }
.mu-panel-title small { color:var(--faint); font-size:9px; }
.mu-section-icon { color:var(--gold); font-size:15px; margin-left:7px; }
.mu-field-label { display:block; margin:12px 0 6px; color:var(--muted); font-size:10px; font-weight:700; }
.mu-phone-wrap { display:flex; gap:8px; direction:rtl; }
.mu-phone-input { flex:1; min-width:0; border:1px solid var(--line-strong); border-radius:9px; background:var(--surface-soft); padding:11px 12px; color:var(--ink); font-size:12px!important; direction:rtl; }
.mu-phone-input::placeholder { color:var(--faint); }
.mu-select, .mu-textarea {
  width:100%; border:1px solid var(--line-strong); border-radius:9px; background:var(--surface-soft);
  padding:11px 12px; color:var(--ink); font-size:11px!important;
}
.mu-select { appearance:none; }
.mu-select option { background:var(--surface); color:var(--ink); }
.mu-textarea { min-height:120px; resize:vertical; line-height:1.8; }
.mu-select::placeholder, .mu-textarea::placeholder { color:var(--faint); }
.mu-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.mu-form-field { min-width:0; }
.mu-upload-entry { display:flex; align-items:center; gap:10px; min-height:42px; padding:7px 10px; border:1px dashed var(--line-strong); border-radius:9px; color:var(--muted); font-size:10px; cursor:pointer; }
.mu-upload-entry input { display:none; }
.mu-upload-entry img { width:28px; height:28px; object-fit:cover; border-radius:7px; }
.mu-room-preview { overflow:hidden; border:1px solid var(--line); border-radius:13px; background:var(--surface-soft); }
.mu-room-top { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--surface-raised); }
.mu-room-avatar { width:35px; height:35px; display:grid; place-items:center; overflow:hidden; border:1px solid var(--line-strong); border-radius:11px; color:var(--gold); background:var(--gold-wash); font-size:13px; }
.mu-room-avatar img { width:100%; height:100%; object-fit:cover; }
.mu-room-title strong { display:block; font-size:11px; }
.mu-room-title small { display:block; margin-top:2px; color:var(--faint); font-size:8px; }
.mu-room-banner { padding:8px 12px; border-bottom:1px solid var(--line); color:var(--gold); background:var(--gold-wash); font-size:9px; }
.mu-room-body { min-height:175px; display:grid; grid-template-columns:minmax(0,1fr) 180px; }
.mu-room-messages { display:grid; place-items:center; padding:12px; }
.mu-room-rail { padding:13px; border-right:1px solid var(--line); }
.mu-room-rail h3 { margin:0 0 8px; font-size:10px; }
.mu-room-rail p { margin:0; color:var(--faint); font-size:9px; line-height:1.8; }
.mu-gate { max-width:600px; margin:0 auto; padding:22px; border:1px solid rgba(217,189,120,.26); border-radius:15px; background:linear-gradient(140deg,var(--gold-wash),transparent 60%),var(--surface); }
.mu-gate h2 { margin:0; font-size:17px; }
.mu-gate p { margin:7px 0 15px; color:var(--muted); font-size:10px; line-height:1.8; }
.mu-password-row { display:flex; gap:8px; }
.mu-password-row input { flex:1; min-width:0; padding:11px 12px; border:1px solid var(--line-strong); border-radius:9px; background:var(--surface-soft); color:var(--ink); font-size:11px!important; }
.mu-password-row input::placeholder { color:var(--faint); }
.mu-code-slot { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:60px; margin-top:8px; padding:11px 13px; border:1px dashed color-mix(in srgb,var(--gold) 35%,var(--line)); border-radius:10px; background:var(--gold-wash); }
.mu-code-slot strong { display:block; color:var(--gold); font-size:11px; }
.mu-code-slot small { display:block; margin-top:3px; color:var(--muted); font-size:9px; }
.mu-code-lock { color:var(--gold); font-size:17px; opacity:.8; }
.mu-small-print { margin:10px 0 0; color:var(--faint); font-size:9px; line-height:1.8; }
.mu-inline-alert { margin-top:11px; border-radius:9px; padding:10px 12px; background:var(--accent-wash); color:var(--muted); font-size:10px; line-height:1.8; }
.mu-progress { display:flex; align-items:center; gap:0; margin:13px 0 16px; }
.mu-progress-item { display:flex; align-items:center; gap:7px; color:var(--faint); font-size:9px; white-space:nowrap; }
.mu-progress-dot { width:21px; height:21px; display:grid; place-items:center; border-radius:50%; border:1px solid var(--line-strong); font:9px "DM Mono",monospace; }
.mu-progress-item.active { color:var(--gold); }
.mu-progress-item.active .mu-progress-dot { border-color:var(--gold); background:var(--gold-wash); }
.mu-progress-line { flex:1; height:1px; margin:0 9px; background:var(--line-strong); }
.mu-step-list { display:grid; gap:10px; margin-top:10px; }
.mu-step { display:grid; grid-template-columns:24px 1fr; gap:9px; color:var(--muted); font-size:10px; line-height:1.8; }
.mu-step-index { width:21px; height:21px; display:grid; place-items:center; border:1px solid var(--line); border-radius:7px; color:var(--gold); font:9px "DM Mono",monospace; }
.mu-status-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.mu-state-chip { display:flex; flex-direction:column; gap:4px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--surface-soft); }
.mu-state-chip strong { font-size:10px; }
.mu-state-chip small { color:var(--faint); font-size:8px; line-height:1.5; }
.mu-state-chip.pair { border-color:rgba(196,160,255,.22); color:var(--accent); }
.mu-state-chip.ready { border-color:rgba(134,197,161,.22); color:var(--success); }
.mu-state-chip.disconnected { border-color:rgba(224,185,114,.22); color:var(--warning); }
.mu-state-chip.bad { border-color:rgba(217,137,145,.22); color:var(--danger); }
.mu-state-chip small { color:var(--muted); }
.mu-grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.mu-grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.mu-dashboard-stats { margin:0 0 15px; }
.mu-stat { min-height:110px; position:relative; padding:16px; overflow:hidden; }
.mu-stat::after { content:""; position:absolute; width:80px; height:80px; left:-25px; bottom:-35px; border-radius:50%; background:var(--accent-wash); filter:blur(5px); }
.mu-stat-label { color:var(--muted); font-size:10px; }
.mu-stat-value { display:block; margin:9px 0 4px; font-family:"DM Mono",monospace; font-size:16px; color:var(--faint); letter-spacing:.06em; }
.mu-stat-foot { color:var(--faint); font-size:9px; }
.mu-stat-icon { position:absolute; top:14px; left:15px; color:var(--accent); opacity:.76; }
.mu-actions-row { display:flex; gap:8px; flex-wrap:wrap; }
.mu-empty { min-height:150px; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:23px; }
.mu-empty-symbol { width:39px; height:39px; display:grid; place-items:center; margin-bottom:8px; border:1px solid var(--line); border-radius:13px; color:var(--accent); background:var(--accent-wash); font-size:16px; }
.mu-empty h3 { margin:0; font-size:12px; }
.mu-empty p { max-width:340px; margin:5px 0 0; color:var(--muted); font-size:10px; line-height:1.8; }
.mu-log-row { min-height:54px; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); color:var(--muted); font-size:10px; }
.mu-log-row:first-of-type { border-top:0; }
.mu-log-placeholder { color:var(--faint); font-family:"DM Mono",monospace; letter-spacing:.06em; }
.mu-search { width:min(100%,350px); min-height:40px; display:flex; align-items:center; gap:8px; padding:0 12px; border:1px solid var(--line-strong); border-radius:10px; background:var(--surface-soft); color:var(--muted); }
