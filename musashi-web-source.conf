  assert.equal(list.json.items.length, 1); assert.equal(list.json.items[0].status, "new");
  await d.patch(`/api/dev/complaints/${r1.json.id}`, { reply: "تم إصلاحها", status: "resolved" });
  const tr = await c.post("/api/complaints/track", { items: [{ id: r1.json.id, key: r1.json.trackKey }, { id: r1.json.id, key: "bad" }] });
  assert.equal(tr.json.items.length, 1);
  assert.equal(tr.json.items[0].reply, "تم إصلاحها"); assert.equal(tr.json.items[0].status, "resolved");
  await c.post("/api/complaints", { type: "bug", text: "مشكلة ثانية طويلة كفاية" });
  await c.post("/api/complaints", { type: "bug", text: "مشكلة ثالثة طويلة كفاية" });
