  const [contact, setContact] = useState("");
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [items, setItems] = useState<J[]>([]);

  const loadMine = async () => {
    let tracked: J[] = [];
    try { tracked = JSON.parse(localStorage.getItem(LS_COMPLAINTS) || "[]"); } catch { /* فارغ */ }
    const out: Record<number, J> = {};
    if (tracked.length) { try { for (const c of (await post("/api/complaints/track", { items: tracked })).items) out[c.id] = c; } catch { /* تجاهل */ } }
    if (owner.me?.authenticated) { try { for (const c of (await get("/api/owner/complaints")).items) out[c.id] = c; } catch { /* تجاهل */ } }
    setItems(Object.values(out).sort((a, b) => b.ts - a.ts));
  };
  useEffect(() => { get("/api/complaints/types").then((r) => setTypes(r.types)).catch(() => {}); void loadMine(); }, [owner.me?.authenticated]); // eslint-disable-line react-hooks/exhaustive-deps
  useEffect(() => {
    if (!owner.me?.authenticated) return;
    return listen("/api/owner/stream", { complaint: () => void loadMine() });
  }, [owner.me?.authenticated]); // eslint-disable-line react-hooks/exhaustive-deps

  const submit = async (e: FormEvent) => {
    e.preventDefault(); setErr(""); setOk("");
    try {
      const r = await post("/api/complaints", { type, text, contact });
      try { const l = JSON.parse(localStorage.getItem(LS_COMPLAINTS) || "[]"); l.push({ id: r.id, key: r.trackKey }); localStorage.setItem(LS_COMPLAINTS, JSON.stringify(l.slice(-30))); } catch { /* تجاهل */ }
      setText(""); setContact(""); setOk("وصلت شكواك للمطور ✅ ستتابع حالتها والرد هنا."); await loadMine();
    } catch (x) { setErr(errMsg(x)); }
  };

  return (
    <section className="mu-page">
      <Head eyebrow="SUPPORT INBOX" title="الشكاوى" text="أرسل شكواك للمطور مباشرة (حتى 3 يومياً) وتابع حالتها وردّه." />
      <div className="mu-install-grid">
        <form className="mu-panel mu-panel-inner" onSubmit={submit}>
          <div className="mu-panel-title"><h2>شكوى جديدة</h2></div>
          <label className="mu-field-label" htmlFor="mu-c-type">النوع</label>
          <select className="mu-phone-input" id="mu-c-type" value={type} onChange={(e) => setType(e.currentTarget.value)}>{Object.entries(types).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select>
          <label className="mu-field-label" htmlFor="mu-c-text">التفاصيل</label>
          <textarea className="mu-phone-input mu-textarea" id="mu-c-text" rows={5} maxLength={1000} value={text} onChange={(e) => setText(e.currentTarget.value)} required />
          <label className="mu-field-label" htmlFor="mu-c-contact">رقم للتواصل (اختياري)</label>
          <input className="mu-phone-input" id="mu-c-contact" dir="ltr" maxLength={40} value={contact} onChange={(e) => setContact(e.currentTarget.value)} />
          <Err text={err} />{ok && <div className="mu-inline-alert">{ok}</div>}
          <div className="mu-actions-row" style={{ marginTop: 12 }}><button className="mu-btn-primary" type="submit" disabled={text.trim().length < 10}>إرسال</button></div>
        </form>
        <div className="mu-panel mu-panel-inner">
          <div className="mu-panel-title"><h2>شكاواي</h2><small>{items.length}</small></div>
          {items.length === 0 ? <Empty symbol="📮" title="لا شكاوى بعد" text="شكاواك المرسلة من هذا المتصفح (أو من حسابك) تظهر هنا." /> : (
            <ul className="mu-ticket-list">{items.map((c) => (
              <li key={c.id}>
                <div className="mu-ticket-head"><b>{c.typeLabel}</b><span className={`mu-chip s-${c.status}`}>{STATUS_AR[c.status]}</span></div>
                <p>{c.text}</p>
                {c.reply && <div className="mu-dev-reply"><b>رد المطور:</b> {c.reply}</div>}
                <small>{fmtDate(c.ts)}</small>
              </li>))}
            </ul>)}
        </div>
      </div>
    </section>
  );
}

/* ───────────── محادثة المطور ───────────── */

export function DevChatPage({ owner, goTo }: Common) {
  const [msgs, setMsgs] = useState<J[]>([]);
  const [text, setText] = useState("");
  const [err, setErr] = useState("");
  const authed = Boolean(owner.me?.authenticated);
  const end = useRef<HTMLDivElement>(null);
  useEffect(() => { if (authed) get("/api/owner/devchat").then((r) => setMsgs(r.messages)).catch(() => {}); }, [authed]);
  useEffect(() => { if (!authed) return; return listen("/api/owner/stream", { devchat: (m) => setMsgs((l) => [...l, m]) }); }, [authed]);
  useEffect(() => { end.current?.scrollIntoView({ block: "end" }); }, [msgs.length]);
  const send = async (e: FormEvent) => {
    e.preventDefault(); const t = text.trim(); if (!t) return; setErr("");
    try { const r = await post("/api/owner/devchat", { text: t }); setMsgs((l) => [...l, r.message]); setText(""); } catch (x) { setErr(errMsg(x)); }
  };
  return (
    <section className="mu-page">
      <Head eyebrow="DEVELOPER CONTACT" title="محادثة المطور" text="محادثة خاصة بينك وبين المطور، لا يراها غيركما." />
      {!authed ? (
        <div className="mu-panel mu-panel-inner"><Empty symbol="🔐" title="تحتاج الدخول أولاً" text="هذه المحادثة متاحة لأصحاب البوتات بعد دخول لوحة التحكم." />
          <div className="mu-actions-row" style={{ justifyContent: "center" }}><button className="mu-btn-primary" type="button" onClick={() => goTo("dashboard")}>دخول اللوحة</button></div></div>
      ) : (
        <div className="mu-panel mu-chat-room">
          <div className="mu-chat-list" role="log" aria-live="polite">
            {msgs.length === 0 && <Empty symbol="⌁" title="لا توجد رسائل" text="اكتب للمطور وسيرد عليك هنا." />}
            {msgs.map((m) => (
              <div key={m.id} className={`mu-msg ${m.from === "owner" ? "mine" : "dev"}`}>
                <div className="mu-bubble"><div className="mu-msg-meta"><b>{m.from === "dev" ? "المطور ⚔️" : "أنت"}</b><time>{fmtTime(m.ts)}</time></div><p>{m.text}</p></div>
              </div>))}
            <div ref={end} />
          </div>
          <form className="mu-chat-compose" onSubmit={send}>
            <input className="mu-phone-input" maxLength={1000} value={text} onChange={(e) => setText(e.currentTarget.value)} placeholder="اكتب للمطور…" aria-label="رسالة للمطور" />
            <button className="mu-btn-primary" type="submit" disabled={!text.trim()}>إرسال</button>
          </form>
          <Err text={err} />
        </div>
      )}
    </section>
  );
}

