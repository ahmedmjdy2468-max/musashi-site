function LoginFlow({ owner, goTo }: { owner: Owner; goTo: Common["goTo"] }) {
  const [phone, setPhone] = useState("");
  const [step, setStep] = useState<1 | 2>(1);
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);
  const [disc, setDisc] = useState(false);

  const request = async (e: FormEvent) => {
    e.preventDefault(); setError(""); setBusy(true);
    try { const r = await post("/api/auth/request", { phone }); setInfo(r.message); setStep(2); }
    catch (err) { setError(errMsg(err)); }
    setBusy(false);
  };
  const verify = async (e: FormEvent) => {
    e.preventDefault(); setError(""); setBusy(true);
    try { await post("/api/auth/verify", { phone, code }); await owner.refresh(); }
    catch (err) {
      if (err instanceof ApiError && err.data?.disconnected) setDisc(true);
      setError(errMsg(err) + (err instanceof ApiError && err.data?.attemptsLeft != null ? ` (متبقي ${err.data.attemptsLeft} محاولات)` : ""));
    }
    setBusy(false);
  };

  return (
    <div className="mu-panel mu-panel-inner mu-login">
      {owner.forced && <div className="mu-state-banner warn"><strong>البوت منفصل ⚠️ — أعد التنصيب</strong><span>تم إخراجك من اللوحة. بياناتك محفوظة، وبعد إعادة التنصيب تدخل بكود جديد.</span><button className="mu-btn-primary" type="button" onClick={() => goTo("install")}>إعادة التنصيب</button></div>}
      <div className="mu-panel-title"><h2><span className="mu-section-icon">🔐</span> دخول صاحب البوت</h2><small>مرة واحدة والجلسة باقية</small></div>
      {step === 1 ? (
        <form onSubmit={request}>
          <label className="mu-field-label" htmlFor="mu-login-phone">رقمك المسجّل عند التنصيب</label>
          <div className="mu-phone-wrap">
            <input className="mu-phone-input" id="mu-login-phone" dir="ltr" inputMode="tel" placeholder="9689xxxxxxx" value={phone} onChange={(e) => setPhone(e.currentTarget.value)} required />
            <button className="mu-btn-primary" type="submit" disabled={busy || !phone.trim()}>إرسال الكود</button>
          </div>
          <p className="mu-small-print">سيصلك كود من 6 أرقام على واتساب عبر البوت الرئيسي.</p>
        </form>
      ) : (
        <form onSubmit={verify}>
          <div className="mu-inline-alert">{info}</div>
          <label className="mu-field-label" htmlFor="mu-login-code">كود التحقق (6 أرقام)</label>
          <div className="mu-phone-wrap">
            <input className="mu-phone-input mu-otp" id="mu-login-code" dir="ltr" inputMode="numeric" autoComplete="one-time-code" maxLength={6} placeholder="••••••" value={code} onChange={(e) => setCode(e.currentTarget.value.replace(/\D/g, ""))} required />
            <button className="mu-btn-primary" type="submit" disabled={busy || code.length !== 6}>دخول</button>
          </div>
          <div className="mu-actions-row" style={{ marginTop: 10 }}>
            <button className="mu-btn-quiet" type="button" onClick={() => { setStep(1); setCode(""); setError(""); }}>تغيير الرقم</button>
            {disc && <button className="mu-btn-secondary" type="button" onClick={() => goTo("install")}>إعادة التنصيب</button>}
          </div>
        </form>
      )}
      <Err text={error} />
    </div>
  );
}

const STATE_LABEL: Record<string, string> = { connected: "متصل ✅", stopped: "متوقف ⏸", disconnected: "منفصل ⚠️", pairing: "قيد الإقران", none: "غير معروف" };

export function DashboardPage({ owner, goTo, toast }: Common) {
  const [d, setD] = useState<J | null>(null);
  const [ann, setAnn] = useState<J[]>([]);
  const authed = Boolean(owner.me?.authenticated);

  const load = () => get("/api/owner/dashboard").then(setD).catch(() => { void owner.refresh(); });
  useEffect(() => { if (authed) void load(); else setD(null); }, [authed, owner.me?.state]); // eslint-disable-line react-hooks/exhaustive-deps
  useEffect(() => { get("/api/announcements").then((r) => setAnn(r.items)).catch(() => {}); }, []);
  useEffect(() => {
    if (!authed) return;
    return listen("/api/owner/stream", { announcement: (a) => setAnn((l) => [a, ...l]) });
  }, [authed]);

  const act = async (a: "stop" | "start") => {
    try { await post(`/api/owner/bot/${a}`); toast(a === "stop" ? "تم إيقاف البوت." : "تم تشغيل البوت."); await owner.refresh(); await load(); }
    catch (e) { toast(errMsg(e)); }
  };

  return (
    <section className="mu-page">
      <Head eyebrow="OWNER OVERVIEW" title="لوحة التحكم" text="حالة بوتك وإحصاءاته وسجل أحداثه."
        aside={authed ? <button className="mu-btn-quiet" type="button" onClick={() => void owner.logout()}>تسجيل الخروج</button> : undefined} />
      {ann[0] && <div className="mu-note" style={{ marginBottom: 14 }}><span className="mu-note-symbol">📢</span><span><b>إعلان المطور:</b> {ann[0].text}</span></div>}

      {owner.loading ? <div className="mu-panel mu-panel-inner"><Empty symbol="…" title="جارٍ التحميل" text="" /></div>
        : !authed ? <LoginFlow owner={owner} goTo={goTo} />
        : (
          <>
            <div className="mu-grid-3 mu-dashboard-stats">
              <div className="mu-panel mu-stat"><span className="mu-stat-icon">◉</span><span className="mu-stat-label">حالة البوت</span><strong className={`mu-stat-value live st-${d?.state}`}>{d ? STATE_LABEL[d.state] ?? d.state : "—"}</strong><span className="mu-stat-foot" dir="ltr">{d?.phone}</span></div>
              <div className="mu-panel mu-stat"><span className="mu-stat-icon">⌘</span><span className="mu-stat-label">الأوامر المتاحة</span><strong className="mu-stat-value live">{d ? d.commandsCount : "—"}</strong><span className="mu-stat-foot">من البوت مباشرة</span></div>
              <div className="mu-panel mu-stat"><span className="mu-stat-icon">↗</span><span className="mu-stat-label">آخر اتصال</span><strong className="mu-stat-value live small">{d ? fmtDate(d.connectedAt) : "—"}</strong><span className="mu-stat-foot">تنصيب: {d ? fmtDate(d.installedAt) : "—"}</span></div>
            </div>
            {d?.stats && <div className="mu-panel mu-panel-inner" style={{ marginBottom: 14 }}><div className="mu-panel-title"><h2>إحصاءات البوت</h2></div><div className="mu-kv">{Object.entries(d.stats).map(([k, v]) => <div key={k}><span>{k}</span><b>{String(v)}</b></div>)}</div></div>}
            <div className="mu-panel mu-panel-inner">
              <div className="mu-panel-title"><h2>التحكم</h2><small>إيقاف مؤقت دون فقد الربط</small></div>
              <div className="mu-actions-row">
                {d?.state === "stopped"
                  ? <button className="mu-btn-primary" type="button" onClick={() => void act("start")}>▶　تشغيل البوت</button>
                  : <button className="mu-btn-secondary" type="button" onClick={() => void act("stop")}>⏸　إيقاف البوت</button>}
                <button className="mu-btn-quiet" type="button" onClick={() => goTo("developer")}>👨‍💻　تواصل مع المطور</button>
              </div>
              <p className="mu-small-print">إن انفصل البوت (تسجيل خروج من واتساب مثلاً) ستُخرَج من اللوحة تلقائياً، ثم أعد التنصيب وادخل بكود جديد وبياناتك محفوظة.</p>
            </div>
            <div className="mu-panel mu-panel-inner" style={{ marginTop: 14 }}>
              <div className="mu-panel-title"><h2>سجل الأحداث</h2><small>آخر {d?.events?.length ?? 0}</small></div>
              {d?.events?.length ? (
                <ul className="mu-log">{d.events.map((e: J) => <li key={e.id}><time>{fmtDate(e.ts)}</time><span>{EVENT_AR[e.type] ?? e.type}</span>{e.detail && <small>{e.detail}</small>}</li>)}</ul>
              ) : <Empty symbol="⌁" title="لا توجد أحداث بعد" text="ستظهر هنا محاولات الدخول وتغييرات حالة البوت." />}
            </div>
          </>
        )}
    </section>
  );
}

