    if (lock.locked) return bad(res, 423, "LOCKED", "الحساب مقفل مؤقتاً بسبب محاولات خاطئة.", { retryAfter: lock.retryAfter });
    // رد موحّد سواء كان الرقم مسجلاً أم لا (منع تعداد الأرقام)
    const generic = { ok: true, message: "إن كان الرقم مسجلاً فقد أُرسل إليه رمز تحقق على واتساب." };
    if (!botByPhone(phone)) return res.json(generic);
    const code = String(crypto.randomInt(0, 1_000_000)).padStart(6, "0");
    codes.set(phone, { hash: hmac(cfg.sessionSecret, `${phone}:${code}`), exp: now() + CODE_TTL });
    try {
