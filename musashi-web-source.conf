test("الشات: دخول، حد ثانيتين، روابط وكلمات مسيئة، 200 رسالة، الرقم مقنّع", async () => {
  const s = await boot(); const c = s.client();
  await install(s, c); await login(s, c);
  assert.equal((await c.post("/api/chat/send", { text: "x" })).status, 401);
  assert.equal((await c.post("/api/chat/join", { name: "محمد", avatar: "data:text/html;base64,AAA" })).status, 400);
  assert.equal((await c.post("/api/chat/join", { name: "محمد" })).status, 200);
  const stream = await sse(`${s.base}/api/chat/stream`, `mu=${c.jar.mu}`);
  await stream.wait("history");
  assert.equal((await c.post("/api/chat/send", { text: "السلام عليكم" })).status, 200);
  const m = await stream.wait("message");
  assert.equal(m.phone, "+968***567"); assert.equal(m.name, "محمد");
  assert.equal((await c.post("/api/chat/send", { text: "ثاني" })).status, 429);
  const real = Date.now; let t = real(); Date.now = () => (t += 2500);
  try {
    assert.equal((await c.post("/api/chat/send", { text: "زر https://evil.com الآن" })).json.error, "LINK");
    assert.equal((await c.post("/api/chat/send", { text: "wa.me/123" })).json.error, "LINK");
    assert.equal((await c.post("/api/chat/send", { text: "انت حمارر" })).json.error, "BAD");
    assert.equal((await c.post("/api/chat/send", { text: "x".repeat(900) })).status, 200); // يُقتطع إلى 300
    for (let i = 0; i < 205; i++) { Date.now = () => (t += 2500); await c.post("/api/chat/send", { text: "رسالة " + i }); }
  } finally { Date.now = real; }
  assert.equal(s.store.data.chat.length, 200);
  assert.ok(s.store.data.chat.every((x) => x.text.length <= 300));
  stream.close(); s.close();
});

test("الشكاوى: 3 يومياً، تصل المطور، رد المطور يظهر للمشتكي", async () => {
  const s = await boot(); const c = s.client(); const d = s.client();
  assert.equal((await d.post("/api/dev/login", { password: PW })).status, 200);
  const r1 = await c.post("/api/complaints", { type: "bug", text: "البوت لا يرد على الأوامر", contact: "0501" });
