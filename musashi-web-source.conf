export function MusashiInstall() {
  const [destination, setDestination] = useState<Destination>("install");
  const owner = useOwner();
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [phone, setPhone] = useState("");
  const [showSteps, setShowSteps] = useState(false);
  const [palette, setPalette] = useState("wisteria");
  const [mode, setMode] = useState<"night" | "day">("night");
  const [clickSound, setClickSound] = useState(false);
  const [brightness, setBrightness] = useState(82);
  const [sceneId, setSceneId] = useState("sunset");
  const [uploadScene, setUploadScene] = useState("");
  const [search, setSearch] = useState("");
  const [protectedPreview, setProtectedPreview] = useState(false);
  const [toast, setToast] = useState("");
  const [musicPlaying, setMusicPlaying] = useState(false);
  const [musicVolume, setMusicVolume] = useState(0.14);
  const [preferencesLoaded, setPreferencesLoaded] = useState(false);
  const audioRef = useRef<HTMLAudioElement>(null);
  const clickAudioRef = useRef<AudioContext | null>(null);
  const uploadUrlRef = useRef<string | null>(null);
  const toastTimer = useRef<number | null>(null);

  useEffect(() => {
    try {
      const bg = localStorage.getItem("musashi-custom-bg");
      if (bg && bg.startsWith("data:image/")) setUploadScene(bg);
      const saved = localStorage.getItem("musashi-visual-preferences");
      if (saved) {
        const prefs = JSON.parse(saved) as {
          palette?: string;
          mode?: "night" | "day";
          clickSound?: boolean;
          brightness?: number;
          sceneId?: string;
        };
        if (palettes.some((item) => item.id === prefs.palette)) setPalette(prefs.palette!);
        if (prefs.mode === "night" || prefs.mode === "day") setMode(prefs.mode);
        if (typeof prefs.clickSound === "boolean") setClickSound(prefs.clickSound);
        if (typeof prefs.brightness === "number") setBrightness(Math.max(35, Math.min(100, prefs.brightness)));
        if (scenes.some((item) => item.id === prefs.sceneId)) setSceneId(prefs.sceneId!);
      }
    } catch {
      localStorage.removeItem("musashi-visual-preferences");
    } finally {
      setPreferencesLoaded(true);
    }
  }, []);

  useEffect(() => {
    if (!preferencesLoaded) return;
    localStorage.setItem(
      "musashi-visual-preferences",
      JSON.stringify({ palette, mode, clickSound, brightness, sceneId }),
    );
  }, [palette, mode, clickSound, brightness, sceneId, preferencesLoaded]);

  useEffect(() => {
    if (audioRef.current) audioRef.current.volume = musicVolume;
  }, [musicVolume]);

  useEffect(
    () => () => {
      if (uploadUrlRef.current) URL.revokeObjectURL(uploadUrlRef.current);
      if (toastTimer.current) window.clearTimeout(toastTimer.current);
      if (clickAudioRef.current) void clickAudioRef.current.close();
    },
    [],
  );

  const activeScene = scenes.find((scene) => scene.id === sceneId)?.src ?? scenes[0].src;
  const sceneStyle = {
    "--scene": `url("${uploadScene || activeScene}")`,
    "--scene-opacity": `${brightness / 100}`,
  } as CSSProperties;

  const showToast = (message: string) => {
    setToast(message);
    if (toastTimer.current) window.clearTimeout(toastTimer.current);
    toastTimer.current = window.setTimeout(() => setToast(""), 3400);
  };

  const playClickSound = () => {
    if (!clickSound) return;
    try {
      const context = clickAudioRef.current ?? new window.AudioContext();
      clickAudioRef.current = context;
      if (context.state === "suspended") void context.resume();
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      const now = context.currentTime;
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(510, now);
      gain.gain.setValueAtTime(0.018, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.05);
    } catch {
      // Browser audio can be unavailable; the preference still remains saved.
    }
  };

  const nav = (id: string) => goTo(id as Destination);
  const goTo = (id: Destination) => {
    setDestination(id);
    setDrawerOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const uploadBackground = async (event: ChangeEvent<HTMLInputElement>) => {
    const file = event.currentTarget.files?.[0];
    if (!file) return;
    try {
      // تصغير الصورة وحفظها محلياً حتى تبقى بعد إعادة التحميل.
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext("2d")!.drawImage(bmp, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", 0.72);
      setUploadScene(url);
      try { localStorage.setItem("musashi-custom-bg", url); } catch { showToast("الصورة كبيرة للحفظ؛ ستبقى حتى إغلاق الصفحة."); return; }
      showToast("تم تطبيق الخلفية وحفظها على هذا الجهاز.");
    } catch {
      showToast("تعذّر قراءة الصورة.");
    }
  };

  const toggleMusic = async () => {
    const audio = audioRef.current;
    if (!audio) return;
    if (musicPlaying) {
      audio.pause();
      setMusicPlaying(false);
      return;
    }
    try {
      await audio.play();
      setMusicPlaying(true);
    } catch {
      showToast("ملف الموسيقى غير متاح حالياً.");
    }
  };

  const pageTitle = destinations.find((item) => item.id === destination)?.label ?? "تنصيب البوت";
  const filteredCategories = commandCategories.filter((category) =>
    `${category.title} ${category.description}`.includes(search.trim()),
  );

  return (
    <div className="mu" data-palette={palette} data-mode={mode === "night" ? "dark" : "light"} onClickCapture={playClickSound}>
      <div className="mu-shell">
        <button
          className={`mu-drawer-backdrop ${drawerOpen ? "open" : ""}`}
          type="button"
          aria-label="إغلاق القائمة"
          onClick={() => setDrawerOpen(false)}
        />
        <aside className={`mu-sidebar ${drawerOpen ? "open" : ""}`} aria-label="التنقل الرئيسي">
          <div className="mu-brand">
            <div className="mu-brand-mark">⚔</div>
            <div>
              <div className="mu-brand-title">MUSASHI <span>BOT</span></div>
              <div className="mu-brand-tag">لوحة تحكم البوت الفرعي</div>
            </div>
          </div>
          <div className="mu-preview-label"><span>MUSASHI BOT · v5.0</span><i /></div>
          <div className="mu-nav-label">مسارات الواجهة</div>
          <nav className="mu-nav">
            {destinations.map((item) => (
              <button
                key={item.id}
                className="mu-nav-item"
                type="button"
                aria-current={destination === item.id ? "page" : undefined}
                onClick={() => goTo(item.id)}
              >
                <span className="mu-nav-icon">{item.icon}</span>
                <span>{item.label}</span>
                {destination === item.id && <i className="mu-nav-current" />}
              </button>
            ))}
          </nav>
          <div className="mu-sidebar-foot">
            <strong>{owner.me ? owner.me.phone : "زائر"}</strong>
            <span>{owner.me ? "مسجّل الدخول" : "لم تسجّل دخول اللوحة"}</span>
          </div>
        </aside>

        <main className="mu-main">
          <header className="mu-topbar">
            <button className="mu-menu-button" type="button" aria-label="فتح القائمة" onClick={() => setDrawerOpen(true)}>
              <span aria-hidden="true">☰</span>
            </button>
            <div className="mu-crumb"><span>مساحة المالك</span>　/　<b>{pageTitle}</b></div>
            <div className="mu-top-actions">
              <div className="mu-live-pill"><i /> {owner.me ? `بوتك: ${owner.me.state === "stopped" ? "متوقف" : "متصل"}` : "غير مسجّل"}</div>
              <button className="mu-theme-btn" type="button" aria-label="تبديل الوضع النهاري/الليلي" onClick={() => setMode((m) => (m === "night" ? "day" : "night"))}>{mode === "night" ? "☀️" : "🌙"}</button>
            </div>
          </header>

          {destination === "install" && (
            <section className="mu-page">
              <div className="mu-page-head">
                <div>
                  <div className="mu-eyebrow">MUSASHI BOT · SUB-BOT SETUP</div>
                  <h1>ابدأ من هنا، بخطوة واضحة.</h1>
                  <p>ربط البوت الفرعي يبدأ برقمك — ولا يحدث شيء حتى تؤكد الربط من واتساب.</p>
                </div>
                
              </div>

              <div className="mu-hero" style={sceneStyle}>
                <div className="mu-hero-copy">
                  <div className="mu-eyebrow">THE QUIET EDGE · V5.0</div>
                  <h2 className="mu-hero-title">جهّز اتصالك.<br /><em>ثم دع البوت يتكلم.</em></h2>
                  <p>مساحة عربية لإعداد البوت الفرعي ومتابعته. الإقران والحالة والإحصاءات تأتي مباشرة من بوتك.</p>
                  <div className="mu-slogan">سَبْقِ حَسْمَك بِرَقْمِك بُوْتَك الفَرْعِي</div>
                  <div className="mu-hero-actions">
                    <button className="mu-btn-primary" type="button" onClick={() => { setShowSteps(true); document.getElementById("mu-connect-card")?.scrollIntoView({ behavior: "smooth", block: "center" }); }}>
                      ابدأ تجهيز الربط <span aria-hidden="true">←</span>
                    </button>
                    <button className="mu-btn-secondary" type="button" onClick={() => goTo("dashboard")}>استكشف لوحة التحكم</button>
                  </div>
                </div>
                <EyeScene />
              </div>

              <div className="mu-install-grid">
                <ConnectPanel owner={owner} goTo={nav} toast={showToast} onPhase={() => {}} />

                <div className="mu-panel mu-panel-inner">
                  <div className="mu-panel-title">
                    <h2><span className="mu-section-icon">⌁</span> خطوات واتساب</h2>
                    <small>كيف تُدخل الرمز</small>
                  </div>
                  {installSteps}
                  <p className="mu-small-print">قد تختلف أسماء القوائم قليلاً بين إصدارات واتساب.</p>
                </div>
              </div>

              <SiteStats />
              <div className="mu-footer"><span><b>MUSASHI ⚔️ BOT</b> · مساحة الإعداد</span><span>v5.0</span></div>
            </section>
          )}

          {destination === "dashboard" && <DashboardPage owner={owner} goTo={nav} toast={showToast} />}

          {destination === "commands" && <CommandsPage />}

          {destination === "group" && <GroupChatPage />}

          {destination === "complaints" && <ComplaintsPage owner={owner} goTo={nav} toast={showToast} />}

          {destination === "developer" && <DevChatPage owner={owner} goTo={nav} toast={showToast} />}

          {destination === "channel" && <ChannelPage />}

          {destination === "customize" && (
            <section className="mu-page">
              <div className="mu-page-head"><div><div className="mu-eyebrow">VISUAL ARMOURY</div><h1>تخصيص الموقع</h1><p>غيّر مظهر الموقع. تُحفظ التفضيلات محلياً على هذا الجهاز.</p></div><div className="mu-preview-pill">تفضيلات محلية</div></div>
              <div className="mu-settings-layout">
                <div>
                  <section className="mu-panel mu-setting-section">
                    <h2>ألوان الواجهة</h2><p>عشر نغمات مستوحاة من مواد وألوان اليابان القديمة.</p>
                    <div className="mu-palette-grid">
                      {palettes.map((item) => (
                        <button className="mu-palette" type="button" key={item.id} aria-pressed={palette === item.id} onClick={() => setPalette(item.id)}>
                          <span className="mu-swatch" style={{ background: `linear-gradient(130deg,${item.color},${item.wash})` }} />
                          <small>{item.label}</small>
                        </button>
                      ))}
                    </div>
                  </section>
                  <section className="mu-panel mu-setting-section">
                    <h2>مشهد الخلفية</h2><p>اختر مشهداً جاهزاً أو ارفع صورة من جهازك.</p>
                    <div className="mu-scene-grid">
                      {scenes.map((scene) => (
                        <button
