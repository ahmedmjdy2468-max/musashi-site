import test from "node:test";
import assert from "node:assert/strict";
import { loadConfig } from "../server/config.js";
import { createStore } from "../server/store.js";
import { createApp } from "../server/app.js";
import { createMockAdapter } from "../server/adapters/mock.js";
import { hashPassword } from "../server/security.js";

const PW = "correct-horse-battery";
async function boot(extra = {}) {
  const cfg = loadConfig({ NODE_ENV: "test", SUB_PAIR_CODE: "MUSASH12", SESSION_SECRET: "x".repeat(40), DEV_PASSWORD_HASH: hashPassword(PW), DATA_FILE: "", MAX_BOTS: "3", DIST_DIR: "./nope", ...extra });
  const adapter = createMockAdapter();
  const store = createStore(null);
  const { app, dispose } = createApp({ cfg, store, adapter });
  const server = await new Promise((r) => { const s = app.listen(0, "127.0.0.1", () => r(s)); });
  const base = `http://127.0.0.1:${server.address().port}`;
  const client = () => {
    const jar = {};
    const call = async (method, url, body, headers = {}) => {
      const r = await fetch(base + url, { method, headers: { "content-type": "application/json", cookie: Object.entries(jar).map(([k, v]) => `${k}=${v}`).join("; "), ...headers }, body: body === undefined ? undefined : JSON.stringify(body) });
      for (const c of r.headers.getSetCookie()) { const [kv, ...attrs] = c.split(";"); const [k, v] = kv.split("="); if (/Max-Age=0/i.test(attrs.join(";"))) delete jar[k]; else jar[k] = v; }
      let json = null; try { json = await r.json(); } catch { /* sse/empty */ }
      return { status: r.status, json, headers: r.headers };
    };
    return { get: (u, h) => call("GET", u, undefined, h), post: (u, b, h) => call("POST", u, b ?? {}, h), patch: (u, b) => call("PATCH", u, b), del: (u) => call("DELETE", u), jar };
  };
  return { adapter, store, client, base, close: () => { dispose(); server.closeAllConnections(); server.close(); } };
}
const sse = async (url, cookie = "") => {
  const ctl = new AbortController();
  const r = await fetch(url, { signal: ctl.signal, headers: { cookie } });
  const reader = r.body.getReader(); const dec = new TextDecoder(); const events = [];
  (async () => { let buf = ""; try { for (;;) { const { value, done } = await reader.read(); if (done) break; buf += dec.decode(value); let i; while ((i = buf.indexOf("\n\n")) >= 0) { const blk = buf.slice(0, i); buf = buf.slice(i + 2); const ev = /event: (.+)/.exec(blk)?.[1]; const d = /data: (.+)/.exec(blk)?.[1]; if (ev) events.push([ev, JSON.parse(d)]); } } } catch { /* abort */ } })();
  return { events, close: () => ctl.abort(), wait: async (name, ms = 2000) => { const t = Date.now(); while (Date.now() - t < ms) { const e = events.find((x) => x[0] === name); if (e) return e[1]; await new Promise((r) => setTimeout(r, 20)); } throw new Error("timeout waiting " + name); } };
};
const PHONE = "96891234567";

async function install(s, c, phone = PHONE) {
  const r = await c.post("/api/install", { phone });
  assert.equal(r.status, 200, JSON.stringify(r.json));
  const stream = await sse(`${s.base}/api/install/events?t=${r.json.watch}`);
  const pair = await stream.wait("pair");
  s.adapter.simulateReady(phone);
  await stream.wait("ready");
  stream.close();
  return pair;
}
async function login(s, c, phone = PHONE) {
  await c.post("/api/auth/request", { phone });
  const code = s.adapter.lastCode(phone);
  assert.match(code, /^\d{6}$/);
  return { code, res: await c.post("/api/auth/verify", { phone, code }) };
}

test("تنصيب: الكود الثابت 8 أحرف عبر حدث pair ثم ready", async () => {
  const s = await boot(); const c = s.client();
  const pair = await install(s, c);
  assert.equal(pair.code, "MUSASH12");
  s.close();
});

test("إعداد خاطئ: SUB_PAIR_CODE بشرطة أو أطول من 8 يرفض التشغيل", () => {
  assert.throws(() => loadConfig({ SUB_PAIR_CODE: "ABCD-EFG", SESSION_SECRET: "x".repeat(40) }));
  assert.throws(() => loadConfig({ SUB_PAIR_CODE: "ABCDEFGHI", SESSION_SECRET: "x".repeat(40) }));
});

test("تنصيب واحد لكل رقم: المفعّل لا يُنصَّب مجدداً، والمنفصل يُسمح له", async () => {
  const s = await boot(); const c = s.client();
  await install(s, c);
  const dup = await c.post("/api/install", { phone: PHONE });
  assert.equal(dup.status, 409); assert.equal(dup.json.error, "ACTIVE");
  s.adapter.simulateClose(PHONE);
  const re = await c.post("/api/install", { phone: PHONE });
  assert.equal(re.status, 200); assert.equal(re.json.reinstall, true);
  s.close();
});

