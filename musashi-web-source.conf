    if (!phone || code.length !== 6) return bad(res, 400, "INPUT", "أدخل الرقم والرمز المكوّن من 6 أرقام.");
    const lock = loginLock.check(phone);
    if (lock.locked) return bad(res, 423, "LOCKED", "الحساب مقفل 15 دقيقة بسبب محاولات خاطئة.", { retryAfter: lock.retryAfter });
    const entry = codes.get(phone);
    const expect = entry && entry.exp > now() ? entry.hash : null;
    const ok = expect !== null && safeEqual(hmac(cfg.sessionSecret, `${phone}:${code}`), expect);
    if (!ok) {
      const f = loginLock.fail(phone);
      logEvent("login_failed", phone, f.locked ? "قُفل 15 دقيقة" : "");
      if (f.locked) { codes.delete(phone); return bad(res, 423, "LOCKED", "5 محاولات خاطئة: قُفل الدخول 15 دقيقة."); }
